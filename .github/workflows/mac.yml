name: mac

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      # ============================================================
      # Checkout repository
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Configure macOS Remote Management / VNC
      # ============================================================
      - name: Configure macOS VNC
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "Configuring macOS Remote Management / VNC"
          echo "=========================================="

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "Disabling Spotlight indexing..."
          sudo mdutil -i off -a

          # --------------------------------------------------------
          # Activate Remote Management
          # --------------------------------------------------------
          echo "Activating Remote Management..."

          sudo "$ARD" \
            -activate \
            -configure \
            -access -on \
            -users runner \
            -privs -all \
            -restart \
            -agent \
            -menu

          echo "Remote Management activated."

          # --------------------------------------------------------
          # Enable legacy VNC authentication
          # --------------------------------------------------------
          echo "=========================================="
          echo "Enabling legacy VNC authentication"
          echo "=========================================="

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          echo "Legacy VNC authentication enabled."

          # --------------------------------------------------------
          # Set VNC password
          # --------------------------------------------------------
          echo "=========================================="
          echo "Setting VNC password"
          echo "=========================================="

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          echo "VNC password configured."

          # --------------------------------------------------------
          # Restart Remote Management
          # --------------------------------------------------------
          echo "=========================================="
          echo "Restarting Remote Management"
          echo "=========================================="

          sudo "$ARD" -restart -agent

          echo "Remote Management restarted."

          # --------------------------------------------------------
          # Prevent the runner from sleeping
          # --------------------------------------------------------
          echo "Starting caffeinate..."

          sudo caffeinate -dimsu &

          # --------------------------------------------------------
          # Wait for VNC
          # --------------------------------------------------------
          echo "Waiting for VNC service..."
          sleep 5

          # --------------------------------------------------------
          # Check local VNC port
          # --------------------------------------------------------
          echo "=========================================="
          echo "Checking local VNC port 5900"
          echo "=========================================="

          nc -zv 127.0.0.1 5900

          echo "Local VNC port 5900 is OPEN."

          # --------------------------------------------------------
          # Check ARDAgent
          # --------------------------------------------------------
          echo "=========================================="
          echo "VNC process"
          echo "=========================================="

          ps aux | grep -i '[A]RDAgent' || true

          # --------------------------------------------------------
          # Check listening socket
          # --------------------------------------------------------
          echo "=========================================="
          echo "Listening socket"
          echo "=========================================="

          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          # --------------------------------------------------------
          # Safely verify VNC configuration file exists
          # DO NOT print its contents because it contains
          # authentication material.
          # --------------------------------------------------------
          echo "=========================================="
          echo "VNC legacy configuration file"
          echo "=========================================="

          if [ -f /Library/Preferences/com.apple.VNCSettings.txt ]; then
            echo "VNCSettings file EXISTS."
            sudo ls -l /Library/Preferences/com.apple.VNCSettings.txt

            echo "VNCSettings file size:"
            sudo wc -c < /Library/Preferences/com.apple.VNCSettings.txt
          else
            echo "WARNING: VNCSettings file DOES NOT EXIST."
          fi

          echo "=========================================="
          echo "VNC configuration completed"
          echo "=========================================="

      # ============================================================
      # Connect Mac runner to Tailscale
      # ============================================================
      - name: Connect Mac to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # ============================================================
      # Display Tailscale IP
      # ============================================================
      - name: Show Tailscale Address
        run: |
          echo "=========================================="
          echo "Tailscale IPv4 address"
          echo "=========================================="

          tailscale ip -4

          echo "=========================================="
          echo "Tailscale status"
          echo "=========================================="

          tailscale status

      # ============================================================
      # Test VNC through Tailscale
      # ============================================================
      - name: Test VNC Connection
        run: |
          set -e

          MAC_IP="$(tailscale ip -4 | head -n 1)"

          echo "=========================================="
          echo "Mac Tailscale IP"
          echo "=========================================="
          echo "$MAC_IP"

          echo "=========================================="
          echo "Testing VNC port through Tailscale"
          echo "=========================================="

          nc -zv "$MAC_IP" 5900

          echo "=========================================="
          echo "VNC TCP connection is working"
          echo "=========================================="

      # ============================================================
      # Keep GitHub Mac runner alive
      # ============================================================
      - name: Keep Alive
        run: |
          echo "=========================================="
          echo "macOS GUI desktop is initialized and running"
          echo "=========================================="

          while true; do

            echo ""
            echo "----- $(date) -----"

            echo "Tailscale status:"
            tailscale status

            echo ""
            echo "VNC port:"
            nc -zv 127.0.0.1 5900

            echo ""
            echo "Keeping runner alive..."

            sleep 60

          done
