name: mac

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Initialize macOS Virtual Display & Screen Sharing
        run: |
          sudo mdutil -i off -a

          # Set password for runner user
          sudo dscl . -passwd /Users/runner "${{ secrets.VNC_USER_PASSWORD }}"

          # Force GUI automatic login for runner
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "runner"

          # Configure Apple Remote Desktop and Screen Sharing
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users runner -privs -all -restart -agent -console

          # Set legacy VNC password
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "${{ secrets.VNC_PASSWORD }}"

          # Launch Aqua GUI environment and wake the display
          sudo caffeinate -u -t 21600 &
          sudo killall WindowServer || true

      - name: Start Cloudflare Tunnel
        run: |
          brew install cloudflare/cloudflare/cloudflared
          cloudflared tunnel --url tcp://localhost:5900 > cloudflared.log 2>&1 &
          sleep 12
          cat cloudflared.log

      - name: Keep Alive
        run: |
          echo "=========================================="
          echo "macOS GUI desktop is initialized and running"
          echo "=========================================="
          sleep 21600
