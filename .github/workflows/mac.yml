name: mac

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Start macOS Remote Desktop
        run: |
          bash configure.sh "${{ secrets.VNC_USER_PASSWORD }}" "${{ secrets.VNC_PASSWORD }}"
          echo "=========================================="
          echo "VNC SERVER IS RUNNING"
          echo "=========================================="
          sleep 21600
