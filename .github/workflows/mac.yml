name: mac

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure macOS Desktop & Screen Sharing
        run: |
          sudo mdutil -i off -a
          
          # Set runner password without requiring old password
          echo "${{ secrets.VNC_USER_PASSWORD }}" | sudo passwd -u runner
          
          # Enable Screen Sharing / Remote Management
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users runner -privs -all -clientopts -setvnclegacy -vnclegacy yes

          # Configure legacy VNC password
          echo "${{ secrets.VNC_PASSWORD }}" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt

          # Restart remote agent and wake up session
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console
          sudo caffeinate -u -t 5 &

      - name: Start Cloudflare Tunnel
        run: |
          brew install cloudflare/cloudflare/cloudflared
          cloudflared tunnel --url tcp://localhost:5900 > cloudflared.log 2>&1 &
          sleep 12
          cat cloudflared.log

      - name: Keep Alive
        run: |
          echo "=========================================="
          echo "VNC session is active"
          echo "=========================================="
          sleep 21600
