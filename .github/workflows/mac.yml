name: mac

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure macOS Desktop & Screen Sharing
        run: |
          sudo mdutil -i off -a
          
          # Create user with sysadminctl
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "${{ secrets.VNC_USER_PASSWORD }}" -admin
          
          # Enable Apple Remote Desktop / Screen Sharing for vncuser
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users vncuser -privs -all -restart -agent -menu

          # Set legacy VNC password
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "${{ secrets.VNC_PASSWORD }}"

          # Restart remote agent
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console

      - name: Start Cloudflare Tunnel
        run: |
          brew install cloudflare/cloudflare/cloudflared
          cloudflared tunnel --url tcp://localhost:5900 > cloudflared.log 2>&1 &
          sleep 12
          cat cloudflared.log

      - name: Keep Alive
        run: |
          echo "=========================================="
          echo "VNC session is active"
          echo "=========================================="
          sleep 21600
