name: mac

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS VNC
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "Configuring macOS Remote Management / VNC"
          echo "=========================================="

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          sudo mdutil -i off -a

          echo "Activating Remote Management..."
          sudo "$ARD" \
            -activate \
            -configure \
            -access -on \
            -users runner \
            -privs -all \
            -restart \
            -agent \
            -menu

          echo "Enabling legacy VNC authentication..."
          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          echo "Setting VNC password..."
          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          echo "Restarting Remote Management..."
          sudo "$ARD" -restart -agent

          echo "Starting caffeinate..."
          sudo caffeinate -dimsu &

          echo "Waiting for VNC service..."
          sleep 5

          echo "=========================================="
          echo "Checking port 5900"
          echo "=========================================="

          nc -zv 127.0.0.1 5900

          echo "=========================================="
          echo "Remote Management status"
          echo "=========================================="

          echo "=========================================="
          echo "VNC configuration completed"
          echo "=========================================="

          # Keep GUI session awake
          sudo caffeinate -dimsu &
                - name: Diagnose VNC
    run: |
          echo "=========================================="
          echo "VNC PROCESS"
          echo "=========================================="
          ps aux | grep -i '[A]RDAgent' || true

          echo "=========================================="
          echo "PORT 5900"
          echo "=========================================="
          nc -zv 127.0.0.1 5900

          echo "=========================================="
          echo "LISTENING SOCKET"
          echo "=========================================="
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          echo "=========================================="
          echo "REMOTE MANAGEMENT CONFIG"
          echo "=========================================="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure \
            -getvnclegacy

          echo "=========================================="
          echo "DONE"
          echo "=========================================="
      - name: Connect Mac to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Show Tailscale Address
        run: |
          echo "=========================================="
          echo "Tailscale IPv4 address:"
          tailscale ip -4
          echo "=========================================="
          tailscale status

      - name: Keep Alive
        run: |
          echo "=========================================="
          echo "macOS GUI desktop is initialized and running"
          echo "=========================================="

          while true; do
            echo "----- $(date) -----"
            echo "Tailscale status:"
            tailscale status
            echo "VNC port:"
            nc -zv 127.0.0.1 5900
            echo "Keeping runner alive..."
            sleep 60
          done
