name: mac

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure macOS Desktop & Screen Sharing
        run: |
          sudo mdutil -i off -a
          
          # 1. Create dedicated user using sysadminctl (avoids password failure)
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "${{ secrets.VNC_USER_PASSWORD }}" -admin
          
          # 2. Enable GUI auto-login to render the desktop
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "vncuser"
          
          # 3. Enable Apple Remote Desktop / Screen Sharing
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users vncuser -privs -all -restart -agent -menu

          # 4. Set legacy VNC password
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "${{ secrets.VNC_PASSWORD }}"

          # 5. Prevent sleep and force UI session awake
          sudo caffeinate -dimsu -w $$ &

      - name: Start Cloudflare Tunnel
        run: |
          brew install cloudflare/cloudflare/cloudflared
          cloudflared tunnel --url tcp://localhost:5900 > cloudflared.log 2>&1 &
          sleep 12
          cat cloudflared.log

      - name: Keep Alive
        run: |
          echo "=========================================="
          echo "macOS GUI desktop is initialized and running"
          echo "=========================================="
          sleep 21600
