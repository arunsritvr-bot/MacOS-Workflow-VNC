name: mac

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure macOS GUI & Screen Sharing
        run: |
          sudo mdutil -i off -a
          
          # Create vncuser
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "${{ secrets.VNC_USER_PASSWORD }}" -admin
          
          # Enable Auto-Login for GUI session
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "runner"
          
          # Enable Apple Remote Desktop / VNC
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users runner,vncuser -privs -all -restart -agent -menu

          # Set legacy VNC password
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "${{ secrets.VNC_PASSWORD }}"

          # Wake display & launch GUI shell
          sudo caffeinate -dimsu -t 21600 &
          open -a Finder

      - name: Start Cloudflare Tunnel
        run: |
          brew install cloudflare/cloudflare/cloudflared
          cloudflared tunnel --url tcp://localhost:5900 > cloudflared.log 2>&1 &
          sleep 12
          cat cloudflared.log

      - name: Keep Alive
        run: |
          echo "=========================================="
          echo "VNC session is active"
          echo "=========================================="
          sleep 21600
