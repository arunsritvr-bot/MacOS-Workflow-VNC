name: mac

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: macos-15-intel

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # CONFIGURE macOS REMOTE MANAGEMENT / VNC
      # ============================================================
      - name: Configure macOS Desktop & Screen Sharing
        run: |
          set -e

          echo "=========================================="
          echo "Configuring macOS Remote Management / VNC"
          echo "=========================================="

          echo ""
          echo "Disabling Spotlight indexing..."
          sudo mdutil -a -i off || true

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console || true

          CONSOLE_USER="$(stat -f "%Su" /dev/console)"
          echo "Console user = $CONSOLE_USER"

          echo ""
          echo "Checking GUI processes..."
          pgrep -fl WindowServer || true
          pgrep -fl loginwindow || true
          pgrep -fl SystemUIServer || true

          echo ""
          echo "=========================================="
          echo "ENABLING REMOTE MANAGEMENT"
          echo "=========================================="

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -allowOthers -on \
            -configure -restart -agent -privs -all

          echo ""
          echo "=========================================="
          echo "SETTING USER REMOTE CONTROL PRIVILEGES"
          echo "=========================================="

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -users "$CONSOLE_USER" \
            -access -on \
            -privs -all || true

          echo ""
          echo "=========================================="
          echo "SETTING VNC ACCESS"
          echo "=========================================="

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "${VNC_PASSWORD}" || true

          echo ""
          echo "Restarting Remote Management..."

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent -privs -all || true

          echo ""
          echo "Restarting System UI..."
          killall SystemUIServer 2>/dev/null || true

          sleep 10

          echo ""
          echo "=========================================="
          echo "PROCESS CHECK"
          echo "=========================================="

          pgrep -fl WindowServer || true
          pgrep -fl loginwindow || true
          pgrep -fl SystemUIServer || true
          pgrep -fl ARDAgent || true
          pgrep -fl screensharingd || true
          pgrep -fl VNCPrivilegeProxy || true

          echo ""
          echo "=========================================="
          echo "PORT 5900 CHECK"
          echo "=========================================="

          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          echo ""
          echo "Testing local VNC port..."
          nc -vz 127.0.0.1 5900

          echo ""
          echo "VNC configuration complete."

        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}


      # ============================================================
      # GUI SESSION DIAGNOSTICS
      # ============================================================
      - name: Diagnose macOS GUI Session
        run: |
          echo "=========================================="
          echo "macOS GUI SESSION DIAGNOSTICS"
          echo "=========================================="

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console || true

          echo ""
          echo "Console user UID:"
          CONSOLE_USER="$(stat -f "%Su" /dev/console)"
          id "$CONSOLE_USER" || true

          echo ""
          echo "Logged-in users:"
          who || true

          echo ""
          echo "CGSession:"
          /System/Library/CoreServices/Menu\ Extras/User.menu/Contents/Resources/CGSession -s || true

          echo ""
          echo "WindowServer:"
          pgrep -fl WindowServer || true

          echo ""
          echo "SystemUIServer:"
          pgrep -fl SystemUIServer || true

          echo ""
          echo "loginwindow:"
          pgrep -fl loginwindow || true

          echo ""
          echo "ARDAgent:"
          pgrep -fl ARDAgent || true

          echo ""
          echo "screensharingd:"
          pgrep -fl screensharingd || true

          echo ""
          echo "VNCPrivilegeProxy:"
          pgrep -fl VNCPrivilegeProxy || true

          echo ""
          echo "Display information:"
          system_profiler SPDisplaysDataType 2>&1 || true

          echo ""
          echo "=========================================="
          echo "END GUI SESSION DIAGNOSTICS"
          echo "=========================================="


      # ============================================================
      # SCREEN CAPTURE TEST
      # ============================================================
      - name: Test macOS Screen Capture
        run: |
          set +e

          echo "=========================================="
          echo "REAL macOS SCREEN CAPTURE TEST"
          echo "=========================================="

          CONSOLE_USER="$(stat -f "%Su" /dev/console)"
          CONSOLE_UID="$(id -u "$CONSOLE_USER")"

          echo ""
          echo "Console user: $CONSOLE_USER"
          echo "Console UID: $CONSOLE_UID"

          echo ""
          echo "Creating screenshot directory..."

          mkdir -p "$RUNNER_TEMP/mac-screen-test"

          SCREENSHOT="$RUNNER_TEMP/mac-screen-test/mac-screen.png"

          echo ""
          echo "Attempting screencapture..."

          if [ "$CONSOLE_USER" = "root" ]; then
            echo "WARNING: console user is root."
            echo "This may indicate that no normal GUI user session is active."
          fi

          echo ""
          echo "Running screencapture as console user..."

          sudo -u "$CONSOLE_USER" \
            /usr/sbin/screencapture \
            -x \
            -C \
            "$SCREENSHOT"

          CAPTURE_RESULT=$?

          echo ""
          echo "screencapture exit code: $CAPTURE_RESULT"

          if [ -f "$SCREENSHOT" ]; then
            echo ""
            echo "SCREENSHOT FILE CREATED"
            ls -lh "$SCREENSHOT"

            echo ""
            echo "Screenshot information:"
            file "$SCREENSHOT" || true

            echo ""
            echo "Screenshot dimensions:"
            sips -g pixelWidth -g pixelHeight "$SCREENSHOT" 2>&1 || true

            echo ""
            echo "Screenshot file size:"
            stat -f "%z bytes" "$SCREENSHOT" || true
          else
            echo ""
            echo "NO SCREENSHOT FILE WAS CREATED"
          fi

          echo ""
          echo "=========================================="
          echo "SCREEN CAPTURE TEST COMPLETE"
          echo "=========================================="

          exit 0


      # ============================================================
      # UPLOAD SCREENSHOT
      # ============================================================
      - name: Upload macOS Screen Capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-screen-test
          path: ${{ runner.temp }}/mac-screen-test/
          if-no-files-found: warn


      # ============================================================
      # SCREEN SHARING DIAGNOSTICS
      # ============================================================
      - name: Diagnose Screen Sharing
        run: |
          echo "=========================================="
          echo "SCREEN SHARING DIAGNOSTICS"
          echo "=========================================="

          echo ""
          echo "Remote Management preferences:"
          sudo defaults read /Library/Preferences/com.apple.RemoteManagement 2>&1 || true

          echo ""
          echo "Screen Sharing launchd service:"
          sudo launchctl print system/com.apple.screensharing 2>&1 || true

          echo ""
          echo "Running screen sharing processes:"
          pgrep -fl screensharingd || true
          pgrep -fl VNCPrivilegeProxy || true
          pgrep -fl ARDAgent || true

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console || true

          echo ""
          echo "WindowServer:"
          pgrep -fl WindowServer || true

          echo ""
          echo "=========================================="
          echo "END SCREEN SHARING DIAGNOSTICS"
          echo "=========================================="


      # ============================================================
      # CONNECT MAC RUNNER TO TAILSCALE
      # ============================================================
      - name: Connect Mac to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}


      # ============================================================
      # SHOW TAILSCALE ADDRESS
      # ============================================================
      - name: Show Tailscale Address
        run: |
          echo "=========================================="
          echo "TAILSCALE INFORMATION"
          echo "=========================================="

          tailscale version

          echo ""
          echo "Tailscale status:"
          tailscale status || true

          echo ""
          echo "Tailscale IPv4:"
          tailscale ip -4 || true

          echo ""
          echo "=========================================="
          echo "VNC CONNECTION"
          echo "=========================================="

          MAC_IP="$(tailscale ip -4 | head -1)"

          echo "Mac Tailscale IP:"
          echo "$MAC_IP"

          echo ""
          echo "Connect from Windows using:"
          echo "vncviewer64-1.14.1.exe -SecurityTypes VncAuth -AutoSelect=0 -FullColor=1 -PreferredEncoding=Raw ${MAC_IP}:5900"

          echo ""
          echo "VNC password = GitHub secret VNC_PASSWORD"


      # ============================================================
      # TEST VNC CONNECTION
      # ============================================================
      - name: Test VNC Connection
        run: |
          set -e

          echo "=========================================="
          echo "TESTING VNC CONNECTION"
          echo "=========================================="

          MAC_IP="$(tailscale ip -4 | head -1)"

          echo ""
          echo "Mac Tailscale IP: $MAC_IP"

          echo ""
          echo "Testing TCP port 5900..."
          nc -vz "$MAC_IP" 5900

          echo ""
          echo "Port 5900 is reachable through Tailscale."

          echo ""
          echo "Listening socket:"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          echo ""
          echo "=========================================="
          echo "VNC NETWORK TEST PASSED"
          echo "=========================================="


      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Alive
        run: |
          echo "=========================================="
          echo "MACOS VNC SESSION READY"
          echo "=========================================="

          MAC_IP="$(tailscale ip -4 | head -1)"

          echo ""
          echo "=========================================="
          echo "REMOTE MAC INFORMATION"
          echo "=========================================="

          echo "Tailscale IP: $MAC_IP"
          echo "VNC Port: 5900"
          echo "Username: runner"

          echo ""
          echo "=========================================="
          echo "WINDOWS TIGERVNC COMMAND"
          echo "=========================================="

          echo "vncviewer64-1.14.1.exe -SecurityTypes VncAuth -AutoSelect=0 -FullColor=1 -PreferredEncoding=Raw ${MAC_IP}:5900"

          echo ""
          echo "=========================================="
          echo "KEEPING MAC RUNNER ALIVE"
          echo "=========================================="

          while true
          do
            echo ""
            echo "------------------------------------------"
            date

            echo ""
            echo "Tailscale IP:"
            tailscale ip -4 || true

            echo ""
            echo "VNC port:"
            nc -z 127.0.0.1 5900 && echo "5900 OPEN" || echo "5900 CLOSED"

            echo ""
            echo "GUI processes:"
            pgrep -fl WindowServer || true
            pgrep -fl ARDAgent || true
            pgrep -fl screensharingd || true

            sleep 60
          done
